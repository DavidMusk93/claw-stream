<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c26"/>
      <stop offset="1" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ba9"/>
      <stop offset="0.45" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#b8123f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="starClip">
      <polygon points="256,86 295.97,200.99 417.68,203.47 320.67,277.01 355.93,393.53 256,324 156.07,393.53 191.33,277.01 94.32,203.47 216.03,200.99"/>
    </clipPath>
  </defs>

  <!-- App-icon body -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Fake neon bloom (layered soft stars, no filters needed) -->
  <g transform="translate(256 256) scale(1.28) translate(-256 -256)">
    <polygon points="256,86 295.97,200.99 417.68,203.47 320.67,277.01 355.93,393.53 256,324 156.07,393.53 191.33,277.01 94.32,203.47 216.03,200.99"
             fill="#ff375f" opacity="0.10" stroke="#ff375f" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <g transform="translate(256 256) scale(1.13) translate(-256 -256)">
    <polygon points="256,86 295.97,200.99 417.68,203.47 320.67,277.01 355.93,393.53 256,324 156.07,393.53 191.33,277.01 94.32,203.47 216.03,200.99"
             fill="#ff5c85" opacity="0.22" stroke="#ff5c85" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- Main star: gradient + rounded joins -->
  <polygon points="256,86 295.97,200.99 417.68,203.47 320.67,277.01 355.93,393.53 256,324 156.07,393.53 191.33,277.01 94.32,203.47 216.03,200.99"
           fill="url(#star)" stroke="url(#star)" stroke-width="16" stroke-linejoin="round"/>

  <!-- Gloss sweep across the top -->
  <g clip-path="url(#starClip)">
    <ellipse cx="256" cy="118" rx="180" ry="72" fill="url(#gloss)"/>
  </g>

  <!-- Play triangle (rounded) -->
  <polygon points="236,202 236,310 324,256"
           fill="#ffffff" opacity="0.96"
           stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
</svg>
